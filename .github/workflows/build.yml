name: Build APK & LIB
on:
  push:
    branches: [ principal ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Dar permissão de execução
        run: chmod +x gradlew

      - name: Compilar o projeto
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FF_ESP_APK
          path: app/build/outputs/apk/release/*.apk

      - name: Upload LIB
        uses: actions/upload-artifact@v4
        with:
          name: FF_ESP_LIB
          path: app/build/intermediates/cxx/**/obj/arm64-v8a/libzygisk_esp.so
