name: Build APK & LIB

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Construir
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Cache do Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/gradle-wrapper.properties') }}-${{ hashFiles('**/*.gradle*', '**/gradle.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Dar permissão e verificar arquivos
        run: |
          ls -la
          chmod +x ./gradlew
          ls -la gradlew
          ls -la gradle/wrapper/

      - name: Compilar o projeto (release)
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: FF_ESP_APK
          path: app/build/outputs/apk/release/*.apk

      - name: Subir LIB (todas as ABIs encontradas)
        uses: actions/upload-artifact@v4
        with:
          name: FF_ESP_LIB
          # pega a .so em qualquer subpasta de intermediates/ ou build/ outputs de objetos nativos
          path: |
            app/build/intermediates/**/obj/**/*.so
            app/build/**/obj/**/*.so
            app/build/**/jniLibs/**/*.so
