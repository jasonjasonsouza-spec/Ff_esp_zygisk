name: Build APK & LIB

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Construir
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Dar permissão e verificar arquivos
        run: |
          ls -la
          chmod +x gradlew
          ls -la gradlew
          ls -la gradle/wrapper/

      - name: Compilar o projeto
        run: ./gradlew assembleRelease --no-daemon

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: FF_ESP_APK
          path: app/build/outputs/apk/release/*.apk

      - name: Subir LIB
        uses: actions/upload-artifact@v4
        with:
          name: FF_ESP_LIB
          path: app/build/intermediates/cxx/**/obj/arm64-v8a/libzygisk_esp.so
